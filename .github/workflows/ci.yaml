name: CICD Pipeline

on:
  push:

jobs:
  project-testing:
    runs-on: ubuntu-latest

    env:
      # DagsHub / MLflow credentials
      DAGSHUB_TRACKING_URI: ${{ secrets.DAGSHUB_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      # 3. Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Set DagsHub token for scripts
      - name: Set DAGSHUB_TOKEN
        run: echo "DAGSHUB_TOKEN=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      # 6. Run DVC pipeline
      - name: Run DVC pipeline
        run: dvc repro

      # 7. Run model tests
      - name: Run model tests
        run: python -m unittest tests/test_model.py

      # 8. Register model in MLflow/DagsHub
      - name: Register Model
        run: python -m src.model.register_model

      # 9. Evaluate and promote model
      - name: Evaluate and promote model
        if: success()
        run: |
          python src/model/model_evaluation.py
          python scripts/promote_model.py

      # 10. Deploy app to Hugging Face Space
      - name: Deploy to Hugging Face Space 🚀
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Space details and app folder
          USERNAME=wadood229955
          SPACE_NAME=Asthma_detection_app
          APP_FOLDER=asthama_app
          git clone https://USER:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${USERNAME}/${SPACE_NAME} space_repo
          rsync -av --exclude '.git' $APP_FOLDER/ space_repo/
          cd space_repo
          git config user.email "upwork229955@gmail.com"
          git config user.name "GitHub Actions Bot"
          git add .
          git commit -m "Deploy app via CI/CD" || echo "No changes to commit"
          git push origin main
    