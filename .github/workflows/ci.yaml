name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    env:
      # MLflow / DagsHub setup (available to all steps)
      DAGSHUB_TRACKING_URI: ${{ secrets.DAGSHUB_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set DagsHub token
        run: echo "DAGSHUB_TOKEN=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV    

      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Run model tests
        run: |
          python -m unittest tests/test_model.py


      - name: Register Model
        run: |
          python src/model/register_model.py
    
      - name: Evaluate and promote model
        if: success()
        run: |
          python src/model/model_evaluation.py
          python scripts/promote_model.py

      - name: Set HF_TOKEN
        run: echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> $GITHUB_ENV     

      - name: Deploy to Hugging Face Space
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          USERNAME=wadood229955
          SPACE_NAME=Asthma_detection_app

          git clone https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME space_repo
          rsync -av --exclude '.git' asthama_app/ space_repo/
          cd space_repo
          git config user.email "upwork229955@gmail.com"
          git config user.name "GitHub Actions Bot"

          git remote set-url origin https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME

          git add .
          git commit -m "Deploy app via CI/CD" || echo "No changes to commit"
          git push https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME main
