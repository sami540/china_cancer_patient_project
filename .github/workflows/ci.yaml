name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run pipeline
        run: |
          dvc repro

      - name: Run model tests
        run: |
          python -m unittest tests/test_model.py

      - name: Promote model to production
        if: success()
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        if: success()
        run: python -m unittest tests/test_flask_app.py

      - name: Deploy to Hugging Face Space
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SPACE_NAME=wadood229955       # Replace with your space name
          USERNAME=Asthma_detection_app    # Replace with your HF username

          # Clone HF Space
          git clone https://huggingface.co/spaces/$USERNAME/$SPACE_NAME space_repo

          # Copy files (excluding .git)
          rsync -av --exclude '.git' asthama_app/ space_repo/

          # Commit & Push
          cd space_repo
          git add .
          git commit -m "Deploy app via CI/CD" || echo "No changes to commit"
          git push https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME main