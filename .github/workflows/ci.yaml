name: CICD Pipeline

on:
  push:

jobs:
  project-testing:
    runs-on: ubuntu-latest

    env:
      # DagsHub / MLflow credentials
      DAGSHUB_TRACKING_URI: ${{ secrets.DAGSHUB_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      # 3. Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Set DagsHub token for scripts
      - name: Set DAGSHUB_TOKEN
        run: echo "DAGSHUB_TOKEN=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      # 6. Run DVC pipeline
      - name: Run DVC pipeline
        run: dvc repro

      # 7. Run model tests
      - name: Run model tests
        run: python -m unittest tests/test_model.py

      # 8. Register model in MLflow/DagsHub
      - name: Register Model
        run: python src/model/register_model.py

      # 9. Evaluate and promote model
      - name: Evaluate and promote model
        if: success()
        run: |
          python src/model/model_evaluation.py
          python scripts/promote_model.py

      # 10. Deploy app to Hugging Face Space
      - name: Deploy to Hugging Face Space 🚀
        # Only run if all previous steps succeeded
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Space details and app folder
          USERNAME=wadood229955
          SPACE_NAME=Asthma_detection_app
          APP_FOLDER=asthama_app
          
          # Clone the Hugging Face Space repository using the token for authentication
          git clone https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME space_repo
          
          # Copy the application files into the cloned repository, excluding the .git folder
          rsync -av --exclude '.git' $APP_FOLDER/ space_repo/
          
          # Change directory to the cloned repo
          cd space_repo
          
          # Configure Git user for the commit
          git config user.email "upwork229955@gmail.com"
          git config user.name "GitHub Actions Bot"

          # Re-configure the origin remote to use the token for the push
          if git remote | grep origin; then
            git remote set-url origin https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME
          else
            git remote add origin https://$HF_TOKEN@huggingface.co/spaces/$USERNAME/$SPACE_NAME
          fi
          
          # Commit changes (use '|| echo' to prevent failure if there are no changes)
          git add .
          git commit -m "Deploy app via CI/CD" || echo "No changes to commit"
          
          # Force push to update the Space
          git push origin main --force